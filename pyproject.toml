[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitconfig-hijack-scanner"
version = "1.0.0"
description = "Audit git configs for hijack-grade keys (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
gitconfig-hijack-scanner = "gitconfig_hijack_scanner:main"

[tool.setuptools]
py-modules = ["gitconfig_hijack_scanner"]
