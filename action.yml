name: "gitconfig Hijack Scanner"
description: >-
  Audit .git/config (and optionally ~/.gitconfig) for hijack-grade keys like core.hooksPath, credential.helper, and protocol.*.allow that turn a repo clone into code execution. Fails CI on HIGH/CRITICAL findings. By Ingenious AI.
author: "Ingenious AI"

branding:
  icon: "git-commit"
  color: "orange"

inputs:
  target:
    description: Repository directory to scan, relative to the workspace root.
    required: false
    default: "."
  fail-on:
    description: >-
      Comma-separated severities that fail the build (e.g. CRITICAL,HIGH).
    required: false
    default: "CRITICAL,HIGH"

outputs:
  verdict:
    description: Worst severity found (CRITICAL, HIGH, MEDIUM, LOW, INFO, or NONE).
    value: ${{ steps.scan.outputs.verdict }}
  findings-count:
    description: Number of findings.
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Run gitconfig Hijack Scanner
      id: scan
      shell: bash
      run: |
        set -u
        REPORT="$RUNNER_TEMP/scan-report.json"
        export FAIL_ON="${{ inputs.fail-on }}"
        python3 "${{ github.action_path }}/gitconfig_hijack_scanner.py" "${{ github.workspace }}/${{ inputs.target }}" --json > "$REPORT" 2> "$RUNNER_TEMP/scan-stderr.txt" || true
        echo '' | base64 -d > "$RUNNER_TEMP/eval.py"
        python3 "$RUNNER_TEMP/eval.py"
    - name: Fail on findings
      shell: bash
      if: steps.scan.outputs.failed == 'true'
      run: |
        echo "::error::gitconfig Hijack Scanner found findings at or above the fail-on threshold."
        exit 1
